# Regression gates: full pytest, Ruff, strict mypy, whitespace and the extension tests.
# Read-only token, no secrets, every action pinned to a full commit SHA (tag in comment).
name: CI

on:
  pull_request:
  push:
    branches: [main, astra-development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest, Ruff, mypy)
    # macOS is the only supported runtime (scripts/install-macos.sh) and exercises the
    # parser-isolation memory watchdog the product actually relies on.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whitespace check diffs against the base commit
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned Python (.python-version)
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: pytest
        run: uv run --locked pytest -q

      - name: Ruff
        run: uv run --locked ruff check .

      - name: mypy (strict)
        run: uv run --locked mypy --strict src

      - name: Whitespace (changed lines)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD~1" # first push of a branch: check the head commit
          fi
          git diff --check "$base" HEAD

      - name: Tests leave the checkout clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  extension:
    name: Extension (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false # zero npm dependencies: nothing to install or cache

      - name: npm test
        working-directory: extension
        run: npm test
