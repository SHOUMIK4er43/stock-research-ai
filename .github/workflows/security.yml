# Dependency audit (pip-audit over uv.lock) and secret scanning (gitleaks over full git
# history). Read-only token, no secrets, every action pinned to a full commit SHA, every
# downloaded tool verified (hash-locked in uv.lock, or a pinned SHA-256).
name: Security

on:
  pull_request:
  push:
    branches: [main, astra-development]
  schedule:
    - cron: "17 4 * * 1" # weekly: new advisories appear without any code change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export the locked environment (all groups, with hashes)
        run: >-
          uv export --locked --no-emit-project --all-groups --format requirements-txt
          -o "$RUNNER_TEMP/requirements-audit.txt"

      # Fails on ANY advisory: no advisory is ignored. (PyJWT, a transitive dependency of
      # mcp[crypto], was upgraded to 2.15.1, which closed the 14 previously accepted IDs.)
      - name: Enforced audit
        run: >-
          uv run --locked --isolated --only-group audit pip-audit
          -r "$RUNNER_TEMP/requirements-audit.txt"
          --require-hashes --no-deps --disable-pip --progress-spinner off

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, matching both the release's
      # checksums.txt and GitHub's recorded asset digest.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the tip
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # --redact: findings name the rule, file, line and commit, never the secret value.
      # No report artifact is uploaded.
      - name: Scan git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml
          --redact --no-banner --exit-code 1
